# CodeQL static analysis for the Galaxies cloud services.
#
# This replaces the upstream Stars! Nova workflow, which ran on windows-latest
# with codeql-action@v1 and actions/checkout@v2. All three were a problem once the
# cloud port landed: v1 of codeql-action is retired and fails outright, and
# Autobuild on Windows resolves Nova.sln or NovaSetupWindows.sln, the legacy
# WinForms desktop solutions. So the analysis that did run analysed the desktop
# client and never looked at Api, ControlPlane, AiService, AiContract, or
# ServerHost, which are the parts that face the network.
#
# Building Galaxies.slnx explicitly rather than relying on Autobuild keeps this
# pointed at the cloud services and matches what build.yml compiles.

name: "CodeQL"

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly, so a finding in a dependency surfaces without waiting for a push.
    - cron: '0 5 * * 3'

jobs:
  analyse:
    name: Analyse
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          # security-and-quality is broader than the default security-extended.
          # Worth the extra noise here: the fog-of-war boundary is the highest
          # severity class in this project (see SECURITY.md), and the cheapest way
          # to catch a leak is to look at everything that touches empire data.
          queries: security-and-quality

      # Explicit build, not Autobuild. Autobuild picks a solution by heuristic and
      # would find the legacy desktop solutions first.
      - name: Build
        run: |
          dotnet restore Galaxies.slnx
          dotnet build Galaxies.slnx -c Release --no-restore

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:csharp"
